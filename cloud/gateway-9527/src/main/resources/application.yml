server:
  error:
    include-stacktrace: ALWAYS
  port: 9527
  address: 0.0.0.0

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        enabled: false
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # 开启从注册中心动态创建路由功能，利用微服务名进行路由
              enabled: true
          routes:
            - id: provider8001-route
              # 动态路由；目标服务仍需在注册中心以 provider-dept 注册。
              uri: lb://provider-dept
              predicates:
                - Path=/dept/list
                - After=2021-01-31T18:47:58.954+08:00[Asia/Shanghai]

# http://1127.0.0.1:8001/actuator/info
info:
  app.name: provider-hystrix
  company.name: cloud
  build.artifactId: $project.artifactId$
  build.version: $project.version$
